<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>एडमिन लॉगिन — एमपी न्यूज़ नेटवर्क</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/assets/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..600,0..1,-50..200&family=Noto+Sans+Devanagari:wght@400;600;700;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
body{background:linear-gradient(160deg,var(--blue-dark),var(--blue) 60%,var(--blue-light));min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:#fff;border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.25);width:100%;max-width:400px;padding:32px 28px}
.login-card .logo-row{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:22px}
.login-card .logo-row img{height:56px}
.login-card .logo-row .hi{font-size:16px;font-weight:800;color:var(--blue)}
.login-card .logo-row .sub{font-size:12px;color:var(--subtle);font-weight:600;letter-spacing:.03em}
.field{margin-bottom:16px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:6px}
.field .input-wrap{position:relative}
.field input{width:100%;height:44px;border:1px solid var(--border);border-radius:8px;padding:0 14px 0 40px;font-size:14px;background:var(--surface)}
.field input:focus{outline:none;border-color:var(--blue);background:#fff}
.field .material-symbols-outlined{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--subtle);font-size:19px}
.login-btn{width:100%;height:46px;background:var(--blue);color:#fff;border-radius:8px;font-size:14.5px;font-weight:700;margin-top:6px}
.login-btn:hover{background:var(--blue-dark)}
.login-btn:disabled{opacity:.6;cursor:default}
.error-box{background:#FEF2F2;border:1px solid #FECACA;color:var(--red-dark);font-size:13px;font-weight:600;padding:10px 12px;border-radius:8px;margin-bottom:16px;display:none}
.demo-box{margin-top:22px;padding:14px;background:var(--surface);border-radius:8px;font-size:12px;color:var(--ink-soft);line-height:1.7}
.demo-box strong{color:var(--ink)}
.back-link{display:block;text-align:center;margin-top:16px;font-size:12.5px;color:var(--subtle)}
.back-link a{color:var(--blue);font-weight:700;display:inline-flex;align-items:center;gap:4px}
.back-link a .material-symbols-outlined{font-size:16px}
</style>
</head>
<body>
  <div class="login-card">
    <div class="logo-row">
      <img src="/assets/logo.jpg" alt="एमपी न्यूज़ नेटवर्क">
      <span class="hi">एमपी न्यूज़ नेटवर्क</span>
      <span class="sub">ADMIN / EDITORIAL LOGIN</span>
    </div>

    <div class="error-box" id="errorBox"></div>

    <form id="loginForm">
      <div class="field">
        <label>ईमेल</label>
        <div class="input-wrap">
          <span class="material-symbols-outlined">mail</span>
          <input type="email" id="email" placeholder="admin@mpnews.local" required autocomplete="username">
        </div>
      </div>
      <div class="field">
        <label>पासवर्ड</label>
        <div class="input-wrap">
          <span class="material-symbols-outlined">lock</span>
          <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
        </div>
      </div>
      <button type="submit" class="login-btn" id="loginBtn">लॉगिन करें</button>
    </form>

    <div class="demo-box">
      <strong>डेमो लॉगिन:</strong><br>
      सुपर एडमिन: admin@mpnews.local / Admin@123<br>
      एडिटर: editor@mpnews.local / Editor@123<br>
      रिपोर्टर: reporter@mpnews.local / Reporter@123
    </div>

    <span class="back-link"><a href="/"><span class="material-symbols-outlined">arrow_back</span>वेबसाइट पर वापस जाएं</a></span>
  </div>

<script src="/login.js"></script>
</body>
</html>
