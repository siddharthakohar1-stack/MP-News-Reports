<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 70" fill="none">
  <defs>
    <linearGradient id="mpnn_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="mpnn_pulse" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDBA74"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>

  <!-- Network broadcast emblem: Stylized 'MP' signal transmitter / node network inside a dynamic hexagon -->
  <g transform="translate(10, 8)">
    <!-- Hexagonal shield badge -->
    <polygon points="27,2 52,16 52,44 27,58 2,44 2,16" fill="url(#mpnn_grad)" rx="4"/>
    
    <!-- Central broadcast tower / signal waves -->
    <path d="M27 12V38" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="27" cy="14" r="3.5" fill="#FFFFFF"/>
    
    <!-- Broadcast / network signal arcs -->
    <path d="M20 22C17.5 24.5 17.5 28.5 20 31" stroke="#FFEDD5" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M34 22C36.5 24.5 36.5 28.5 34 31" stroke="#FFEDD5" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M15 17C10.5 21.5 10.5 29.5 15 34" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.75" fill="none"/>
    <path d="M39 17C43.5 21.5 43.5 29.5 39 34" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.75" fill="none"/>
    
    <!-- Red LIVE dot beacon -->
    <circle cx="27" cy="46" r="3" fill="#EF4444"/>
    <circle cx="27" cy="46" r="5" stroke="#FFFFFF" stroke-width="1.5" fill="none" opacity="0.8"/>
  </g>

  <!-- Brand Typography: Hindi 'एमपी न्यूज़ नेटवर्क' & English 'MP NEWS NETWORK' -->
  <text x="76" y="36" font-family="'Mukta', 'Noto Sans Devanagari', sans-serif" font-weight="900" font-size="25" fill="#0F172A" letter-spacing="-0.3">एमपी न्यूज़ नेटवर्क</text>
  <text x="78" y="54" font-family="'Inter', -apple-system, sans-serif" font-weight="800" font-size="10.5" fill="#EA580C" letter-spacing="2.5">MP NEWS NETWORK</text>
  <text x="248" y="54" font-family="'Mukta', 'Noto Sans Devanagari', sans-serif" font-weight="600" font-size="10" fill="#64748B" letter-spacing="0.5">| 24×7 लाइव</text>
</svg>
